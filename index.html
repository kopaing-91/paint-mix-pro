<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paint Mix Pro — ဆေးစပ်နည်း</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#14161d;--card:#1f2330;--card2:#262b3b;--accent:#ff9f1c;--accent2:#ffc857;--text:#f5f5f5;--muted:#9aa0b4;--green:#2ec55e;--red:#e5484d;--blue:#3b82f6}
body{font-family:-apple-system,'Segoe UI',Roboto,'Pyidaungsu Font','Myanmar3',sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#232838 0%,var(--bg) 60%);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:90px}
.header{position:sticky;top:0;z-index:20;background:rgba(20,22,29,.95);backdrop-filter:blur(8px);padding:14px 16px;border-bottom:1px solid #2c3145;display:flex;align-items:center;gap:10px}
.header .logo{font-size:28px}
.header h1{font-size:19px;font-weight:800}
.header h1 small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#191d28;border-top:1px solid #2c3145;display:flex;z-index:20}
.tab-btn{flex:1;padding:12px 4px 14px;background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.tab-btn .ico{font-size:22px;display:block;margin-bottom:2px}
.tab-btn.active{color:var(--accent)}
.page{display:none;padding:16px}
.page.active{display:block}
.stepper{display:flex;gap:6px;margin-bottom:16px}
.step-dot{flex:1;height:6px;border-radius:3px;background:#2c3145}
.step-dot.done{background:var(--accent)}
.step-title{font-size:18px;font-weight:800;margin-bottom:4px}
.step-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.brand-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.brand-btn{background:var(--card);border:2px solid #2c3145;border-radius:14px;padding:18px 10px;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;min-height:72px}
.brand-btn:active{transform:scale(.96)}
.brand-btn.sel{border-color:var(--accent);background:#2b2417}
.brand-btn small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}
.model-list{display:flex;flex-direction:column;gap:10px}
.model-btn{background:var(--card);border:2px solid #2c3145;border-radius:14px;padding:16px;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;text-align:left;min-height:60px}
.model-btn:active{transform:scale(.98)}
.model-btn.sel{border-color:var(--accent);background:#2b2417}
.model-btn small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:3px}
.field{background:var(--card);border:2px solid #2c3145;border-radius:14px;padding:16px;margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
.field input,.field textarea,.field select{width:100%;background:#14161d;border:1px solid #3a4058;border-radius:10px;color:var(--text);font-size:16px;padding:14px;font-family:inherit}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.wmi-hint{font-size:13px;margin-top:10px;padding:10px;border-radius:10px;background:#1a2b1a;border:1px solid #2ec55e55;display:none}
.wmi-hint.show{display:block}
.btn{display:block;width:100%;background:linear-gradient(180deg,var(--accent2),var(--accent));border:none;border-radius:14px;color:#1a1206;font-size:17px;font-weight:800;padding:16px;margin-top:12px;cursor:pointer;min-height:56px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--text);border:2px solid #2c3145}
.btn:disabled{opacity:.5}
.back-link{background:none;border:none;color:var(--accent);font-size:14px;font-weight:600;padding:10px 0;cursor:pointer;margin-bottom:6px}
.color-list{display:flex;flex-direction:column;gap:10px}
.color-btn{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid #2c3145;border-radius:14px;padding:12px;cursor:pointer;min-height:72px;text-align:left;width:100%;color:var(--text)}
.color-btn:active{transform:scale(.98)}
.color-btn.sel{border-color:var(--accent)}
.swatch{width:56px;height:56px;border-radius:4px;flex-shrink:0;border:2px solid rgba(255,255,255,.25);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.color-info{flex:1}
.color-info .cn{font-size:15px;font-weight:700}
.color-info .cc{font-size:12px;color:var(--accent);font-weight:700;margin-top:2px}
.color-info .ce{font-size:11px;color:var(--muted)}
.code-card{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:24px 16px;text-align:center;margin:16px 0}
.code-card .lbl{font-size:13px;color:var(--muted)}
.code-card .code{font-size:34px;font-weight:800;color:var(--accent);margin:8px 0;letter-spacing:1px}
.code-card .cname{font-size:16px;font-weight:600}
.ad-box{background:var(--card);border-radius:16px;padding:24px 16px;text-align:center;margin:16px 0}
.ad-sim{background:#0d0f14;border-radius:12px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.ad-sim .ad-tag{font-size:11px;color:var(--muted);letter-spacing:2px}
.ad-sim .ad-title{font-size:20px;font-weight:800;color:var(--accent2)}
.ad-sim .ad-timer{font-size:44px;font-weight:800}
.progress{height:8px;background:#2c3145;border-radius:4px;overflow:hidden;width:100%;max-width:260px}
.progress>div{height:100%;background:var(--accent);width:0%;transition:width .2s}
.formula-card{background:var(--card);border-radius:16px;padding:18px;margin:16px 0}
.formula-card h3{font-size:16px;margin-bottom:12px}
.comp{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #2c3145;font-size:15px}
.comp:last-child{border-bottom:none}
.comp .pct{font-weight:800;color:var(--accent)}
.warn{background:#2b1a1a;border:1px solid #e5484d55;border-radius:12px;padding:12px;font-size:13px;color:#ffb4b4;margin:12px 0;line-height:1.6}
.tip{background:#1a2b1a;border:1px solid #2ec55e55;border-radius:12px;padding:12px;font-size:13px;color:#b4ffc4;margin:12px 0;line-height:1.6}
.nb-item{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid #2c3145}
.nb-item .t{font-size:15px;font-weight:700}
.nb-item .m{font-size:12px;color:var(--muted);margin-top:4px}
.nb-item .acts{display:flex;gap:8px;margin-top:10px}
.nb-item .acts button{flex:1;padding:10px;border-radius:10px;border:1px solid #3a4058;background:var(--card2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;min-height:44px}
.nb-item .acts button.del{border-color:#e5484d66;color:#ff8a8a}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;line-height:1.8}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
/* ---- recipes section ---- */
.search-field{background:var(--card);border:2px solid #2c3145;border-radius:14px;padding:4px 14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.search-field input{flex:1;background:none;border:none;color:var(--text);font-size:16px;padding:12px 0;font-family:inherit}
.search-field input:focus{outline:none}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.chip{flex-shrink:0;padding:10px 16px;border-radius:20px;border:2px solid #2c3145;background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;min-height:44px}
.chip.sel{border-color:var(--accent);color:var(--accent)}
.big-swatch{width:120px;height:120px;border-radius:12px;border:3px solid rgba(255,255,255,.3);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);margin:6px auto 14px;display:block}
.xl-swatch{width:170px;height:170px;border-radius:18px;border:5px solid #ffffff;box-shadow:0 0 0 3px #000,0 4px 18px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.35);margin:10px auto 16px;display:block}
.same-paint{background:rgba(46,197,94,.13);border:2px solid var(--green);border-radius:12px;padding:12px 14px;text-align:center;font-size:16px;margin:12px 0;color:var(--text)}
.fcomp{padding:10px 0;border-bottom:1px solid #2c3145}
.fcomp:last-child{border-bottom:none}
.frow{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin-bottom:7px;gap:8px}
.frow .pct{font-weight:800;color:var(--accent);flex-shrink:0}
.pbar{height:10px;background:#14161d;border-radius:5px;overflow:hidden;border:1px solid #2c3145}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px;transition:width .4s}
.lock-wrap{text-align:center;padding:18px 8px}
.lock-wrap .lk{font-size:44px;margin-bottom:8px}
.lock-wrap p{font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.7}
.recipe-meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 4px}
.recipe-meta span{font-size:12px;color:var(--muted);background:var(--card2);border:1px solid #2c3145;padding:6px 12px;border-radius:14px}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:20px 16px 30px}
.sheet h2{font-size:18px;margin-bottom:14px}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
/* ---- 5-can system ---- */
.fivecan{background:linear-gradient(160deg,#262b3b,#1c2030);border:2px solid var(--accent);border-radius:18px;padding:18px 14px;margin-bottom:16px}
.fivecan h2{font-size:17px;margin-bottom:6px}
.fivecan .tag{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:12px}
.cans{display:flex;gap:8px;justify-content:space-between;margin-bottom:12px}
.can{flex:1;text-align:center;background:#14161d;border:2px solid #2c3145;border-radius:12px;padding:10px 4px;cursor:pointer;min-height:76px;color:var(--text)}
.can .ce{font-size:26px;display:block;margin-bottom:4px}
.can .cn{font-size:11px;font-weight:700;line-height:1.4}
.can.sel{border-color:var(--green);background:#16241a}
.can.opt{border-style:dashed}
.theory{font-size:12.5px;color:var(--muted);line-height:2;background:#14161d;border-radius:12px;padding:12px;margin-bottom:12px}
.theory b{color:var(--text)}
.calc-res{background:#16241a;border:1px solid #2ec55e55;border-radius:12px;padding:12px;font-size:14px;font-weight:700;color:#b4ffc4;margin-top:10px;display:none;line-height:1.7}
.calc-res.show{display:block}
/* ---- code cross-reference ---- */
.code-search-box{background:var(--card);border:2px solid var(--accent);border-radius:18px;padding:16px 14px;margin-bottom:16px}
.code-group{margin-top:10px}
.code-group-head{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid #2c3145;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.5}
.swatch.sm{width:36px;height:36px;min-width:36px}
.code-res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid #2c3145;border-radius:12px;padding:10px 12px;margin-bottom:8px;color:var(--text);cursor:pointer;font-size:14px;font-family:inherit}
.code-res:active{transform:scale(.98)}
/* ---- paint school ---- */
.lvl-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid #2c3145;border-radius:16px;padding:16px;margin-bottom:12px;color:var(--text);cursor:pointer;font-family:inherit}
.lvl-card:active{transform:scale(.98)}
.lvl-ico{font-size:38px;flex-shrink:0}
.lvl-info{flex:1;min-width:0}
.lvl-t{font-size:16px;font-weight:800}
.lvl-e{font-size:12px;color:var(--muted)}
.lvl-p{font-size:12px;color:var(--muted);margin-top:4px}
.lvl-done{font-size:26px;flex-shrink:0}
.les-no{width:44px;height:44px;border-radius:12px;background:var(--card2);border:1px solid #2c3145;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0;color:var(--accent)}
.les-p{font-size:15px;line-height:1.9;margin:12px 0}
.les-p b{color:var(--accent2)}
.mix-lbl{text-align:center;font-size:13px;color:var(--muted);font-weight:600;margin:8px 0 2px}
.mix-row{display:flex;gap:8px;justify-content:center;margin:6px 0}
.mix-can{flex:1;max-width:88px;background:var(--card);border:2px solid #2c3145;border-radius:12px;padding:10px 4px;color:var(--text);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.mix-can span{font-size:26px;display:block;margin-bottom:4px}
.mix-can.sel1{border-color:var(--accent);background:#2b2417}
.mix-can.sel2{border-color:var(--blue);background:#17202b}
.mix-plus{text-align:center;font-size:24px;color:var(--muted);margin:2px 0}
.mix-res{text-align:center;margin-top:12px;background:var(--card);border-radius:16px;padding:16px}
.mix-name{font-size:20px;font-weight:800;margin-top:8px}
.quiz-q{font-size:17px;font-weight:700;background:var(--card);border:2px solid #2c3145;border-radius:14px;padding:18px;margin:14px 0;line-height:1.8}
.quiz-opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid #2c3145;border-radius:12px;padding:15px;font-size:15px;color:var(--text);margin-bottom:10px;cursor:pointer;font-family:inherit}
.quiz-opt.qok{border-color:var(--green);background:#16241a}
.quiz-opt.qbad{border-color:var(--red);background:#2b1a1a}
.quiz-opt:disabled{cursor:default}
</style>
</head>

/* ================= STATE ================= */
let S={step:1,brand:null,model:null,chassis:'',wmi:null,color:null,adWatched:false};
const $=id=>document.getElementById(id);

/* ================= WIZARD ================= */
function renderStepper(){
  const steps=['Brand','Model','Chassis','Color','Code','Formula'];
  $('stepper').innerHTML=steps.map((s,i)=>`<div class="step-dot${i<S.step?' done':''}"></div>`).join('');
}
function go(step){S.step=step;S.adWatched=false;render();}
function render(){
  renderStepper();
  const w=$('wizard');
  if(S.step===1) w.innerHTML=stepBrand();
  else if(S.step===2) w.innerHTML=stepModel();
  else if(S.step===3) w.innerHTML=stepChassis();
  else if(S.step===4) w.innerHTML=stepColor();
  else if(S.step===5) w.innerHTML=stepCode();
  else if(S.step===6) w.innerHTML=stepFormula();
  if(S.step===3) setTimeout(detectWMI,0);
  window.scrollTo(0,0);
}
function backBtn(step){return `<button class="back-link" onclick="go(${step})">← နောက်သို့</button>`;}

function stepBrand(){
  return `<div class="step-title">🏭 Brand ရွေးပါ</div>
  <div class="step-sub">ဘီးရဲ့ company ကို ရွေးပါ</div>
  <div class="brand-grid">${BRANDS.map(b=>`<button class="brand-btn${S.brand===b.id?' sel':''}" onclick="pickBrand('${b.id}')">${b.name}<small>${b.mm} · ${b.note}</small></button>`).join('')}</div>`;
}
function pickBrand(id){S.brand=id;S.model=null;S.color=null;go(2);}

function stepModel(){
  const b=BRANDS.find(x=>x.id===S.brand);
  const ms=MODELS[S.brand]||[];
  return `${backBtn(1)}<div class="step-title">🏍️ Model ရွေးပါ</div>
  <div class="step-sub">${b.name} (${b.mm}) — လူကြိုက်များတဲ့ model တွေ</div>
  <div class="model-list">${ms.map((m,i)=>`<button class="model-btn${S.model===i?' sel':''}" onclick="pickModel(${i})">${m.name}<small>${m.mm} · အရောင် ${m.colors.length} မျိုး</small></button>`).join('')}</div>`;
}
function pickModel(i){S.model=i;S.color=null;go(3);}

function stepChassis(){
  return `${backBtn(2)}<div class="step-title">🔢 ချက်စီ နံပါတ်</div>
  <div class="step-sub">ရှိရင် ရိုက်ထည့်ပါ — brand အတည်ပြုပေးမယ်။ <b>မရှိရင် ကျော်သွားလို့ရတယ်။</b></div>
  <div class="field"><label>ချက်စီ / VIN နံပါတ် (ဇက်နား / ထိုင်ခုံအောက်)</label>

/* ================= CODE CROSS-REFERENCE ================= */
let CODE_IDX=null;
function normCode(s){return String(s||'').toUpperCase().replace(/[\s\-_]/g,'');}
function buildCodeIdx(){
  CODE_IDX=[];
  for(const b of BRANDS){
    const ms=MODELS[b.id]||[];
    ms.forEach((m,mi)=>{
      m.colors.forEach((c,ci)=>{
        if(c.code&&c.code!=='—')CODE_IDX.push({key:b.id+'|'+mi+'|'+ci,bid:b.id,bname:b.name,bmm:b.mm,mi:mi,mname:m.name,mmm:m.mm,ci:ci,c:c});
      });
    });
  }
}
function codeSearch(q){
  if(!CODE_IDX)buildCodeIdx();
  const nq=normCode(q);
  if(nq.length<2)return[];
  return CODE_IDX.filter(e=>normCode(e.c.code).includes(nq));
}
function pickCodeResult(bid,mi,ci){S.brand=bid;S.model=mi;S.color=ci;S.chassis='';go(5);}
function codeRefsWizardHTML(bid,mi,code){
  const list=codeSearch(code).filter(e=>!(e.bid===bid&&e.mi===mi));
  if(!list.length)return '';
  return `<div class="step-title" style="margin-top:16px">🔗 ဒီ ဆေး ကို သုံး တဲ့ ဘီးတွေ (${list.length})</div>
  <div class="same-paint">🎨 Code တူ = <b>ဆေး တူ!</b> — ဒီ ဆေးတံဆိပ် code နဲ့ အတူတူ ဆေးပဲ!</div>
  <div>${list.map(e=>`<button class="code-res" onclick="pickCodeResult('${e.bid}',${e.mi},${e.ci})"><div class="swatch sm" style="background:${e.c.hex}"></div><div style="flex:1">🏭 ${e.bname} · 🏍️ ${e.mname}<br><small style="color:var(--muted)">${e.c.mm} (${e.c.en})</small></div><span style="font-size:20px">→</span></button>`).join('')}</div>`;
}
function codeRefsRecipesHTML(code,curKey){
  const list=codeSearch(code).filter(e=>e.key!==curKey&&recipeByKey(e.key));
  if(!list.length)return '';
  return `<div class="step-title" style="margin-top:16px">🔗 ဒီ ဆေး ကို သုံး တဲ့ ဘီးတွေ (${list.length})</div>
  <div class="same-paint">🎨 Code တူ = <b>ဆေး တူ!</b> — ဒီ ဆေးတံဆိပ် code နဲ့ အတူတူ ဆေးပဲ!</div>
  <div>${list.map(e=>`<button class="code-res" onclick="openRecipe('${e.key}')"><div class="swatch sm" style="background:${e.c.hex}"></div><div style="flex:1">🏭 ${e.bname} · 🏍️ ${e.mname}<br><small style="color:var(--muted)">${e.c.mm} (${e.c.en})</small></div><span style="font-size:20px">→</span></button>`).join('')}</div>`;
}

/* ================= RECIPES (အရောင်စပ်နည်း) ================= */
let R={brand:'all',q:'',cur:null,unlocked:{},cans:null}; /* unlocked: recipe key -> true (this session); cans: selected base cans for filter */
const CANS=[
  {id:'red',e:'🔴',n:'အနီ',opt:false},
  {id:'blue',e:'🔵',n:'အပြာ',opt:false},
  {id:'yellow',e:'🟡',n:'အဝါ',opt:false},
  {id:'black',e:'⚫',n:'အမည်း',opt:false},
  {id:'white',e:'⚪',n:'အဖြူ',opt:false},
  {id:'pearl',e:'✨',n:'ပုလဲ/ငွေရောင်',opt:true},
];
function cansNeeded(c){
  const s=new Set();
  for(const x of (c.f||[])){
    const n=x[0];
    if(n.includes('🔴'))s.add('red');
    else if(n.includes('🔵'))s.add('blue');
    else if(n.includes('🟡'))s.add('yellow');
    else if(n.includes('⚫'))s.add('black');
    else if(n.includes('⚪'))s.add('white');
    else if(n.includes('✨'))s.add('pearl');
  }
  return s;
}
function fiveCanHTML(){
  const sel=R.cans||[];
  const cansBtns=CANS.map(c=>
    `<button class="can${c.opt?' opt':''}${sel.includes(c.id)?' sel':''}" onclick="toggleCan('${c.id}')">
      <span class="ce">${c.e}</span><span class="cn">${c.n}${c.opt?'<br>(အပို)':''}</span>
    </button>`).join('');
  return `<div class="fivecan">
    <h2>🥫 ၅ ဘူး စနစ်</h2>
    <div class="tag">ဆေး <b style="color:var(--accent)">၅ ဘူး</b> ဝယ်ထား → ကြိုက်တဲ့ အရောင် <b style="color:var(--accent)">စပ်လို့ရ!</b><br>
    အောက်က အရောင် <b>အားလုံး</b> ဒီ ၅ ဘူး (+ပုလဲ) နဲ့ပဲ စပ်ထားတာ။</div>
    <div class="cans">${cansBtns}</div>
    <div class="theory">
      <b>🎓 အခြေခံ စပ်နည်း:</b><br>
      🟡 အဝါ + 🔵 အပြာ = <b>🟢 အစိမ်း</b><br>
      🔴 အနီ + 🟡 အဝါ = <b>🟠 လိမ္မော်</b><br>
      🔴 အနီ + 🔵 အပြာ = <b>🟣 ခရမ်း</b><br>
      🔴 အနီ + 🟡 အဝါ + ⚫ အမည်း = <b>🟤 အညို</b><br>
      🔴 အနီ + ⚪ အဖြူ = <b>🌸 ပန်းရောင်</b><br>
      ⚫ အမည်း + ⚪ အဖြူ = <b>⬜ မီးခိုး</b><br>
      ✨ ပုလဲ ထည့် = <b>တောက်�ပ/metallic</b>
    </div>
    <div class="step-sub" style="margin:8px 0 0">👆 အပေါ်က ကိုယ့်မှာ <b>ရှိတဲ့ ဘူး</b>တွေ နှိပ် ရွေး — စပ်လို့ရတဲ့ အရောင်ပဲ ပြမယ်</div>
  </div>`;
}
function toggleCan(id){
  if(!R.cans)R.cans=[];
  const i=R.cans.indexOf(id);
  if(i>=0)R.cans.splice(i,1);else R.cans.push(id);
  renderRecipes();
}
function canFilterOK(r){
  if(!R.cans||!R.cans.length)return true;
  const need=cansNeeded(r.c);
  for(const n of need){if(!R.cans.includes(n))return false;}
  return true;
}
function allRecipes(){
  const out=[];
  for(const b of BRANDS){
    const ms=MODELS[b.id]||[];
    ms.forEach((m,mi)=>{
      m.colors.forEach((c,ci)=>{
        if(c.f&&c.f.length) out.push({key:b.id+'|'+mi+'|'+ci,bid:b.id,brand:b.name,brandMm:b.mm,model:m.name,modelMm:m.mm,c:c});
      });
    });
  }
  return out;
}
function recipeByKey(key){return allRecipes().find(r=>r.key===key);}

  R.cur=null;

    (!q||r.c.mm.toLowerCase().includes(q)||r.c.en.toLowerCase().includes(q)||r.model.toLowerCase().includes(q)||r.brand.toLowerCase().includes(q)) &&

function getSch(){try{return Object.assign({done:{},quiz:{}},JSON.parse(localStorage.getItem('pm_school')||'{}'))}catch(e){return{done:{},quiz:{}}}}
function setSch(s){localStorage.setItem('pm_school',JSON.stringify(s))}
function schProg(i){
  const L=SCHOOL[i],sc=getSch();let d=0;
  L.lessons.forEach((l,j)=>{if(sc.done[i+'-'+j])d++;});
  return{d:d,n:L.lessons.length,q:!!sc.quiz[i]};
}
function renderSchool(){
  $('schoolBody').innerHTML=`<div class="step-title">🎓 ဆေးပညာ</div>
  <div class="step-sub">ဆရာ နဲ့ အတူ တစ် ဆင့် ချင်း — အခြေခံ က နေ Pro ထိ!</div>
  ${SCHOOL.map((L,i)=>{const p=schProg(i),all=p.d===p.n&&p.q;
   return `<button class="lvl-card" onclick="openLevel(${i})">
    <div class="lvl-ico">${L.icon}</div>
    <div class="lvl-info"><div class="lvl-t">${L.mm}</div><div class="lvl-e">${L.en}</div>
    <div class="pbar" style="margin-top:8px"><div style="width:${Math.round(p.d/p.n*100)}%"></div></div>
    <div class="lvl-p">${p.d}/${p.n} သင်ခန်းစာ${p.q?' · 📝✅':''}</div></div>
    <div class="lvl-done">${all?'✅':''}</div></button>`;}).join('')}
  <div class="tip">💡 အကြံ: Level 1 က နေ အစဉ် လိုက် သွား — ပြီးရင် ✅ ပေါ် မယ်!</div>`;
}
function openLevel(i){
  const L=SCHOOL[i],sc=getSch();
  $('schoolBody').innerHTML=`<button class="back-link" onclick="renderSchool()">← ဆေးပညာ</button>
  <div class="step-title">${L.icon} ${L.mm}</div><div class="step-sub">${L.en}</div>
  <div class="tip">👨‍🏫 ${L.intro}</div>
  <div class="color-list">${L.lessons.map((l,j)=>`<button class="color-btn" onclick="openLesson(${i},${j})">
   <div class="les-no">${sc.done[i+'-'+j]?'✅':(j+1)}</div>
   <div class="color-info"><div class="cn">${l.t}</div>${l.type==='mixer'?'<div class="ce">Interactive — ကိုယ် တိုင် စမ်း ကြည့်!</div>':''}</div></button>`).join('')}</div>
  <button class="btn" onclick="openQuiz(${i})">📝 ${L.mm} စာမေးပွဲ ${sc.quiz[i]?'✅':''}</button>`;
  window.scrollTo(0,0);
}
function openLesson(i,j){
  const L=SCHOOL[i],l=L.lessons[j],sc=getSch(),done=sc.done[i+'-'+j];
  let body='';
  if(l.type==='mixer'){body=`<div class="step-title">${l.t}</div><div class="step-sub">ဘူး ၂ ဘူး ရွေး — ဘာ အရောင် ထွက် လာ မလဲ!</div><div id="mixBox">${schMixerHTML()}</div>
   <div class="tip">💡 ဆရာ စကား: ဒီ တွဲ ဖက် တွေ အကုန် မှတ် ထား — ဆိုင် မှာ နေ တိုင်း သုံး ရ မယ်!</div>`;}
  else{
   body=`<div class="step-title">${l.t}</div>`+l.d.map(p=>`<p class="les-p">${p}</p>`).join('')+
   (l.tip?`<div class="tip">💡 ${l.tip}</div>`:'')+(l.warn?`<div class="warn">⚠️ ${l.warn}</div>`:'');
  }
  const prev=j>0?`<button class="btn ghost" onclick="openLesson(${i},${j-1})">← အရင် သင်ခန်းစာ</button>`:'';
  const next=j<L.lessons.length-1
   ?`<button class="btn" onclick="schDone(${i},${j},1)">မှတ် ပြီးပြီ — နောက် →</button>`
   :`<button class="btn" onclick="schDone(${i},${j},0)">✅ ဒီ Level ပြီးပြီ — စာမေးပွဲ →</button>`;
  $('schoolBody').innerHTML=`<button class="back-link" onclick="openLevel(${i})">← ${L.mm}</button>${body}
  ${done?'<div class="tip">✅ ဒီ သင်ခန်းစာ ပြီးပြီ!</div>':''}${prev}${next}`;
  window.scrollTo(0,0);
}
function schDone(i,j,go){
  const sc=getSch();sc.done[i+'-'+j]=1;setSch(sc);
  if(go)openLesson(i,j+1);else openQuiz(i);
}
function schMixerHTML(){
  const key=[SM.a,SM.b].sort().join('+'),r=MIXR[key];
  const row=(which,sel)=>`<div class="mix-row">${CANS5.map(c=>
   `<button class="mix-can${sel===c[0]?(which==='a'?' sel1':' sel2'):''}" onclick="SM.${which}='${c[0]}';schMix()"><span>${c[1]}</span>${c[2]}</button>`).join('')}</div>`;
  return `<div class="mix-lbl">ပထမ ဘူး 👇</div>${row('a',SM.a)}
  <div class="mix-plus">＋</div><div class="mix-lbl">ဒုတိယ ဘူး 👇</div>${row('b',SM.b)}
  <div class="mix-res"><div class="swatch xl-swatch" style="background:${r[2]}"></div>
  <div class="mix-name">${r[0]}</div><div class="step-sub">${r[1]} — ${SM.a===SM.b?'တူ တူ ၂ ဘူး = မူရင်း အရောင်':'၂ ရောင် ရော = အသစ်!'}</div></div>`;
}
function schMix(){$('mixBox').innerHTML=`<div class="step-title">🧪 စမ်းသပ်ခန်း — ၂ ရောင် ရော ကြည့်!</div><div class="step-sub">ဘူး ၂ ဘူး ရွေး — ဘာ အရောင် ထွက် လာ မလဲ!</div>`+schMixerHTML()+`<div class="tip">💡 ဆရာ စကား: ဒီ တွဲ ဖက် တွေ အကုန် မှတ် ထား — ဆိုင် မှာ နေ တိုင်း သုံး ရ မယ်!</div>`;}
function openQuiz(i){SQ={i:i,cur:0,score:0};renderQuiz();}
function renderQuiz(){
  const L=SCHOOL[SQ.i],q=L.quiz[SQ.cur];
  $('schoolBody').innerHTML=`<button class="back-link" onclick="openLevel(${SQ.i})">← ${L.mm}</button>
  <div class="step-title">📝 စာမေးပွဲ — ${L.mm}</div>
  <div class="step-sub">မေးခွန်း ${SQ.cur+1} / ${L.quiz.length}</div>
  <div class="quiz-q">${q.q}</div>
  <div>${q.a.map((a,ix)=>`<button class="quiz-opt" id="qo${ix}" onclick="ansQuiz(${ix})">${a}</button>`).join('')}</div>
  <div id="qfb"></div>`;
  window.scrollTo(0,0);
}
function ansQuiz(ix){
  const L=SCHOOL[SQ.i],q=L.quiz[SQ.cur],ok=ix===q.c;
  if(ok)SQ.score++;
  document.querySelectorAll('.quiz-opt').forEach((b,bi)=>{
    b.disabled=true;
    if(bi===q.c)b.classList.add('qok');else if(bi===ix)b.classList.add('qbad');
  });
  $('qfb').innerHTML=`<div class="${ok?'tip':'warn'}">${ok?'✅ မှန် တယ်! တော် တယ်!':'❌ မှာ သွား တယ် — အဖြေမှန်: '+q.a[q.c]}</div>
  <button class="btn" onclick="nextQuiz()">${SQ.cur<L.quiz.length-1?'နောက် မေးခွန်း →':'အဖြေ ကြည့် →'}</button>`;
}
function nextQuiz(){SQ.cur++;if(SQ.cur>=SCHOOL[SQ.i].quiz.length)quizDone();else renderQuiz();}
function quizDone(){
  const L=SCHOOL[SQ.i],pass=SQ.score>=2,sc=getSch();
  if(pass)sc.quiz[SQ.i]=1;setSch(sc);
  $('schoolBody').innerHTML=`<div class="step-title">📝 ရလဒ် — ${L.mm}</div>
  <div class="code-card"><div class="lbl">ရမှတ်</div><div class="code" style="font-size:52px">${SQ.score}/${L.quiz.length}</div>
  <div class="cname">${pass?'🎉 အောင် ပြီ!':'😅 ထပ် ကြိုး စား ကြည့်'}</div></div>
  ${pass?'<div class="tip">💡 ဒီ Level အောင် ပြီ — နောက် Level ကို သွား လို့ ရ ပြီ!</div>':'<div class="warn">⚠️ ၂ ခု မှန် မှ အောင် တယ် — သင်ခန်းစာ ပြန် ဖတ် ပြီး ပြန် ဖြေ ကြည့်!</div>'}
  <button class="btn" onclick="openLevel(${SQ.i})">← Level ကို ပြန် သွား</button>
  ${pass&&SQ.i<SCHOOL.length-1?`<button class="btn ghost" onclick="openLevel(${SQ.i+1})">နောက် Level →</button>`:''}`;
  window.scrollTo(0,0);
}

/* ================= TABS ================= */
function showTab(t,el){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  $('page-find').classList.toggle('active',t==='find');
  $('page-nb').classList.toggle('active',t==='nb');
  $('page-recipes').classList.toggle('active',t==='recipes');
  $('page-school').classList.toggle('active',t==='school');
  if(t==='nb')renderNb();
  if(t==='recipes'){if(R.cur)openRecipe(R.cur);else renderRecipes();}
  if(t==='school')renderSchool();
}

/* ================= NOTEBOOK ================= */
function getNb(){try{return JSON.parse(localStorage.getItem('pm_notebook')||'[]')}catch(e){return[]}}
function setNb(a){localStorage.setItem('pm_notebook',JSON.stringify(a))}
function renderNb(){
  const list=getNb(),el=$('nbList');
  if(!list.length){el.innerHTML=`<div class="empty">📓<br>မှတ်တမ်း မရှိသေးဘူး<br>ကိုယ်တိုင် စပ်ထားတဲ့ formula တွေ ဒီမှာ သိမ်းပါ</div>`;return;}
  el.innerHTML=list.map((n,i)=>`<div class="nb-item"><div class="t">${esc(n.title)}</div>
   <div class="m">${esc(n.bike||'')} ${n.colorDesc?'· '+esc(n.colorDesc):''}<br>${esc(n.date||'')}</div>
   ${n.formula?`<div class="m" style="color:var(--accent)">🧪 ${esc(n.formula)}</div>`:''}
   ${n.notes?`<div class="m">📝 ${esc(n.notes)}</div>`:''}
   <div class="acts"><button onclick="openNbForm(${i})">✏️ ပြင်မယ်</button><button class="del" onclick="delNb(${i})">🗑️ ဖျက်မယ်</button></div></div>`).join('');
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function openNbForm(idx,preset){
  const list=getNb();
  const n=idx!=null?list[idx]:(preset||{title:'',bike:'',colorDesc:'',formula:'',notes:''});
  $('nbSheet').innerHTML=`<h2>${idx!=null?'✏️ ပြင်မယ်':'＋ Formula အသစ်'}</h2>
  <div class="field"><label>အမည် *</label><input id="nfT" value="${esc(n.title)}" placeholder="ဥပမာ: Wave အနီ candy"></div>
  <div class="field"><label>ဘီး / Model</label><input id="nfB" value="${esc(n.bike)}" placeholder="ဥပမာ: Wave 110i"></div>
  <div class="field"><label>အရောင်</label><input id="nfC" value="${esc(n.colorDesc)}" placeholder="ဥပမာ: အနီတောက်"></div>
  <div class="field"><label>🧪 အချိုး (Formula)</label><textarea id="nfF" rows="3" placeholder="ဥပမာ: အနီ 80% + မာရွန် 15% + ပုလဲ 5%">${esc(n.formula)}</textarea></div>
  <div class="field"><label>📝 မှတ်ချက်</label><textarea id="nfN" rows="2" placeholder="ဥပမာ: 2 coat, matte clear">${esc(n.notes)}</textarea></div>
  <button class="btn" onclick="saveNb(${idx==null?'null':idx})">💾 သိမ်းမယ်</button>
  <button class="btn ghost" onclick="closeNb()">မလုပ်တော့ဘူး</button>`;
  $('nbModal').classList.add('show');
}
function saveNb(idx){
  const t=$('nfT').value.trim();
  if(!t){alert('အမည် ထည့်ပါ!');return;}
  const list=getNb();
  const e={title:t,bike:$('nfB').value.trim(),colorDesc:$('nfC').value.trim(),formula:$('nfF').value.trim(),notes:$('nfN').value.trim(),date:new Date().toLocaleDateString('my-MM')};
  if(idx==null)list.unshift(e);else list[idx]=e;
  setNb(list);closeNb();renderNb();
}
function delNb(i){if(confirm('ဖျက်မှာ သေချာလား?')){const l=getNb();l.splice(i,1);setNb(l);renderNb();}}
function closeNb(){$('nbModal').classList.remove('show');}
$('nbModal').addEventListener('click',e=>{if(e.target.id==='nbModal')closeNb();});

/* ================= INIT ================= */
if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
render();renderNb();
</script>
</body>
